[build]
  publish = "_site"
  command = "pip install pillow && python3 scripts/write-recipe-og.py && npm ci && bundle exec jekyll build"

[build.environment]
  RUBY_VERSION = "3.2.0"
  NODE_VERSION = "22"

[context.production]
  command = "pip install pillow && python3 scripts/write-recipe-og.py && npm ci && bundle exec jekyll build"

[context.deploy-preview]
  command = "pip install pillow && python3 scripts/write-recipe-og.py && npm ci && bundle exec jekyll build --config _dev_config.yml"

[context.branch-deploy]
  command = "pip install pillow && python3 scripts/write-recipe-og.py && npm ci && bundle exec jekyll build --config _dev_config.yml"

[[edge_functions]]
  function = "recipe-cards-og"
  path = "/recipe-cards"

[[edge_functions]]
  function = "recipe-cards-og"
  path = "/recipe-cards/"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=7776000"
    Content-Type = "image/webp"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=7776000"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/page*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=7776000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/dev-diaries/*"
to = "https://jtemporal.github.io/dev-diaries/:splat"
status = 301

[[redirects]]
from = "/*"
to = "/404.html"
status = 404
